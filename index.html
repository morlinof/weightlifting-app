      try {
        if (on && !t.wake && navigator.wakeLock) navigator.wakeLock.request("screen").then(function (l) { t.wake = l; }).catch(function () {});
        if (!on && t.wake) { t.wake.release().catch(function () {}); t.wake = null; }
      } catch (e) {}
    }
    function stopTicking() { clearInterval(t.interval); t.interval = null; }

    // Tempo proposto quando il timer è fermo: il recupero dell'esercizio che stai guardando.
    function presetFromView() {
      if (state.view !== "exercise") return null;
      var cs = currentSession(), e = cs && cs.session && cs.session.exercises[state.exercise];
      if (!e) return null;
      return { secs: restSeconds(e.rest), label: e.name };
    }

    /* --- disegno --- */
    function renderFab() {
      var left = remaining(), active = t.status === "running" || t.status === "paused";
      fab.classList.toggle("done", t.status === "done");
      fab.style.setProperty("--p", active ? progress(left).toFixed(1) : 0);
      fab.innerHTML = '<span class="rt-fab-in">' + (active ? clock(left) : t.status === "done" ? "0:00" : ICON.timer) + '</span>';
      fab.setAttribute("aria-label", active ? "Timer di recupero, mancano " + clock(left) : t.status === "done" ? "Recupero finito" : "Apri il timer di recupero");
      fab.setAttribute("aria-expanded", String(t.open));
    }
    function renderPanel() {
      panel.hidden = !t.open;
      panel.classList.toggle("done", t.status === "done");
      if (!t.open) { panel.innerHTML = ""; return; }
      var left = remaining();
      var top = '<div class="rt-top"><span>' + (t.status === "done" ? "Recupero finito" : "Recupero") + (t.label ? " · " + esc(t.label) : "") + '</span>' +
        '<button class="rt-close" data-t="hide" aria-label="Chiudi il riquadro (il timer continua)">' + ICON.cross + '</button></div>';
      var adjust = function (d, label) { return '<button class="rt-adj" data-t="adj" data-d="' + d + '" aria-label="' + (d > 0 ? "Aggiungi" : "Togli") + ' 15 secondi">' + label + '</button>'; };
      var main = '<div class="rt-main">' + adjust(-15, "−15″") +
        '<div class="rt-time" id="rt-time">' + (t.status === "done" ? "0:00" : clock(left)) + '</div>' + adjust(15, "+15″") + '</div>';
      var bar = '<div class="rt-bar" aria-hidden="true"><i id="rt-bar" style="width:' + progress(left) + '%"></i></div>';
      var actions;
      if (t.status === "ready") actions = '<button class="rt-primary" data-t="start">Avvia ' + clock(t.left) + '</button>';
      else if (t.status === "running") actions = '<button class="rt-secondary" data-t="pause">Pausa</button><button class="rt-secondary" data-t="stop">Stop</button>';
      else if (t.status === "paused") actions = '<button class="rt-primary" data-t="resume">Riprendi</button><button class="rt-secondary" data-t="stop">Stop</button>';
      else actions = '<button class="rt-secondary" data-t="again">Ancora 30″</button><button class="rt-secondary" data-t="stop">OK</button>';
      panel.innerHTML = '<div class="rt-card">' + top + main + bar + '<div class="rt-actions">' + actions + '</div></div>';
      placePanel();
    }
    function render() { renderFab(); renderPanel(); }

    function tick() {
      var left = remaining();
      if (t.status === "running" && left <= 0) return finish();
      var time = document.getElementById("rt-time"), bar = document.getElementById("rt-bar");
      if (time) time.textContent = clock(left);
      if (bar) bar.style.width = progress(left) + "%";
      renderFab();
    }
    function finish() {
      stopTicking(); keepAwake(false);
      t.status = "done"; t.left = 0;
      beep();
      try { if (navigator.vibrate) navigator.vibrate([300, 150, 300]); } catch (e) {}
      render();
    }
    function run() {
      t.endAt = Date.now() + t.left * 1000; t.status = "running";
      stopTicking(); t.interval = setInterval(tick, 250);
      keepAwake(true); render();
    }
    function setReady(secs, label) {
      stopTicking(); keepAwake(false);
      t.total = t.left = secs; t.label = label || ""; t.status = "ready";
    }
    function toggle() {
      if (t.open) { t.open = false; render(); return; }
      if (t.status === "ready") {
        var pre = presetFromView();
        if (pre) setReady(pre.secs || t.total || 90, pre.label);
      }
      t.open = true; render();
    }

    panel.addEventListener("click", function (ev) {
      var b = ev.target.closest("[data-t]"); if (!b) return;
      var a = b.dataset.t;
      if (a === "hide") { t.open = false; render(); }
      else if (a === "start" || a === "resume") { unlockAudio(); run(); }
      else if (a === "pause") { t.left = remaining(); t.status = "paused"; stopTicking(); keepAwake(false); render(); }
      else if (a === "stop") {
        // "Stop" azzera e lascia il riquadro aperto; "OK" a recupero finito lo chiude anche.
        var wasDone = t.status === "done", pre = presetFromView();
        setReady((pre && pre.secs) || t.total || 90, pre ? pre.label : t.label);
        if (wasDone) t.open = false;
        render();
      }
      else if (a === "again") { unlockAudio(); t.total = t.left = 30; run(); }
      else if (a === "adj") {
        var d = Number(b.dataset.d);
        if (t.status === "done") { unlockAudio(); t.total = t.left = Math.max(15, d); run(); return; }
        var left = Math.max(5, remaining() + d);
        t.total = Math.max(5, t.total + d);
        if (left > t.total) t.total = left;
        if (t.status === "running") t.endAt = Date.now() + left * 1000; else t.left = left;
        if (t.status === "ready") render(); else tick();
      }
    });

    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible" && t.status === "running") {
        if (!t.wake) keepAwake(true);
        tick();
      }
    });

    place(); render();

    return {
      // Apre il riquadro con un tempo preciso (pulsante "Timer" nel recupero dell'esercizio).
      // Se un recupero sta già scorrendo non lo interrompo: apro solo il riquadro.
      open: function (secs, label) {
        if (t.status !== "running" && t.status !== "paused") setReady(secs, label);
        t.open = true; render();
      }
    };
  })();

  /* ---------- Avvio ---------- */
  render();
  store.init().then(function () {
    return store.getMaxes().then(function (m) {
      state.maxes = Object.assign({ snatch: "", cj: "", bs: "", fs: "", step: 1, map: {} }, m || {});
    }).catch(function () {}).then(function () { return store.list(); });
  }).then(function (list) {
    state.programs = list; state.loading = false; render();
    // Registri di tutte le schede: servono per i feedback della coach di schede precedenti
    list.forEach(function (p) { loadLogs(p.id); });
    var cc = window.claude;
    if (cc && typeof cc.use === "function") cc.use("sample").then(function (sm) {
      state.aiAvailable = !!sm;
      if (sm && state.view === "exercise") app.querySelectorAll(".log").forEach(function (sec) { if (sec.querySelector(".coach-box")) rerenderLog(sec); });
    }).catch(function () {});
  }).catch(function () {
    state.loading = false; render();
  });
})();
</script>

/* Funzionamento offline: il service worker tiene in memoria la pagina, le librerie e i font. */
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
</script>
