<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Scheda Pesistica</title>
<meta name="description" content="Importa la scheda PDF del coach, registra pesi, serie e note ed esporta il PDF settimanale.">
<meta name="theme-color" content="#eef1f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Scheda">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<style>
/* Layout: colonna unica da telefono (max 560px), barra in alto fissa, schede impilate.
   Colori di intensità presi dai dischi da gara: blu = % 1RM, verde = kg, giallo = RPE. */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --surface-2: #f6f8fa;
  --ink: #131820;
  --muted: #5a6574;
  --line: #d9dfe6;
  --accent: #c9222b;
  --accent-ink: #ffffff;
  --pct: #1d5bbf;
  --kg: #2a7f3f;
  --rpe: #9a6a00;
  --pct-bg: #e3ecfa;
  --kg-bg: #e2f2e6;
  --rpe-bg: #fbf0d4;
  --warn: #a8500c;
  --warn-bg: #fcefe1;
  --ss: #6a3daf;
  --ss-bg: #efe8fa;
  --shadow: 0 1px 2px rgba(19, 24, 32, .06), 0 4px 14px rgba(19, 24, 32, .05);
  --font-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --font-body: "Public Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 14px;
  --fab-track: #3a414c;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --surface: #171b21; --surface-2: #1d2229; --ink: #edf0f3; --muted: #9ba5b2; --line: #2a3039;
    --accent: #ff4b55; --accent-ink: #14080a;
    --pct: #79a8ff; --kg: #63c97c; --rpe: #f2c04a;
    --pct-bg: #182640; --kg-bg: #15291b; --rpe-bg: #2c2410;
    --warn: #f39d52; --warn-bg: #2c1f12; --ss: #b892f5; --ss-bg: #251c36;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
    --fab-track: #c9cfd6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1216; --surface: #171b21; --surface-2: #1d2229; --ink: #edf0f3; --muted: #9ba5b2; --line: #2a3039;
  --accent: #ff4b55; --accent-ink: #14080a;
  --pct: #79a8ff; --kg: #63c97c; --rpe: #f2c04a;
  --pct-bg: #182640; --kg-bg: #15291b; --rpe-bg: #2c2410;
  --warn: #f39d52; --warn-bg: #2c1f12; --ss: #b892f5; --ss-bg: #251c36;
  --shadow: 0 1px 2px rgba(0,0,0,.4);
  --fab-track: #c9cfd6;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.topbar-inner {
  max-width: 560px; margin: 0 auto; padding: 10px 16px;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; min-height: 52px;
}
.topbar h1 {
  margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 20px;
  letter-spacing: .02em; text-transform: uppercase; text-align: center;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 58vw;
}
.topbar .left { justify-self: start; }
.topbar .right { justify-self: end; }

.link-btn {
  background: none; border: 0; padding: 6px 2px; color: var(--accent); font-weight: 600;
  display: inline-flex; align-items: center; gap: 2px; white-space: nowrap;
}
.link-btn svg { width: 18px; height: 18px; }

main { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; display: flex; flex-direction: column; gap: 20px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border-radius: 999px; border: 1px solid transparent; padding: 11px 18px; font-weight: 600;
  min-height: 44px; text-decoration: none;
}
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-ghost { background: var(--surface); border-color: var(--line); }
.btn-danger { background: none; border-color: var(--accent); color: var(--accent); }
.btn-small { min-height: 34px; padding: 6px 14px; font-size: 14px; }
.btn svg { width: 18px; height: 18px; }

.section-label {
  font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  margin: 0 0 8px 4px; display: flex; align-items: center; gap: 6px;
}

.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); }
.list { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.row {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  background: none; border: 0; padding: 14px 16px; border-top: 1px solid var(--line);
}
.list > .row:first-child, .list > :first-child .row:first-child { border-top: 0; }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.row-title { font-weight: 600; }
.row-sub { color: var(--muted); font-size: 13px; }
.chev { color: var(--muted); flex: none; width: 16px; height: 16px; }

.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.setsreps { font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: .01em; font-variant-numeric: tabular-nums; margin-right: 2px; }
.chip {
  display: inline-flex; align-items: baseline; gap: 4px; border-radius: 999px; padding: 2px 9px;
  font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap;
}
.chip small { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; opacity: .8; }
.chip-percent { background: var(--pct-bg); color: var(--pct); }
.chip-load { background: var(--kg-bg); color: var(--kg); }
.chip-rpe { background: var(--rpe-bg); color: var(--rpe); }
.rest { color: var(--muted); font-size: 13px; display: inline-flex; align-items: center; gap: 3px; }
.rest svg { width: 13px; height: 13px; }
.warn-dot { color: var(--warn); flex: none; width: 18px; height: 18px; }

.ss-tag { color: var(--ss); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 4px; }
.ss-tag svg { width: 13px; height: 13px; }
.ss-group { border-left: 3px solid var(--ss); }

.issues { background: var(--warn-bg); color: var(--warn); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500; }
.issues div { display: flex; gap: 8px; align-items: flex-start; }
.issues svg { width: 16px; height: 16px; flex: none; margin-top: 2px; }

.banner { border-radius: 12px; padding: 12px 14px; font-size: 14px; }
.banner-error { background: var(--warn-bg); color: var(--warn); }
.store-note { color: var(--muted); font-size: 12px; text-align: center; }

/* Home */
.hero { display: flex; flex-direction: column; gap: 10px; padding: 8px 4px 0; }
.hero h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 40px; line-height: 1; text-transform: uppercase; letter-spacing: .01em; text-wrap: balance; }
.hero p { margin: 0; color: var(--muted); max-width: 40ch; }
.steps { display: grid; gap: 10px; padding: 16px; }
.step { display: grid; grid-template-columns: 32px 1fr; gap: 10px; align-items: start; }
.step b { font-family: var(--font-display); font-size: 22px; line-height: 1.1; color: var(--accent); }
.step span { color: var(--muted); font-size: 14px; }
.step strong { display: block; color: var(--ink); font-size: 15px; }
.program-title { font-family: var(--font-display); font-weight: 700; font-size: 22px; text-transform: uppercase; letter-spacing: .01em; line-height: 1.1; }
.import-zone { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
.file-input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.busy { display: flex; align-items: center; gap: 10px; color: var(--muted); padding: 12px 4px; }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Review */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); }
.stat { padding: 14px 8px; text-align: center; border-left: 1px solid var(--line); }
.stat:first-child { border-left: 0; }
.stat b { display: block; font-family: var(--font-display); font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.field { display: flex; flex-direction: column; gap: 6px; padding: 12px 16px; border-top: 1px solid var(--line); }
.field:first-child { border-top: 0; }
.field label { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.field input, .field textarea { border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); padding: 10px 12px; width: 100%; min-width: 0; font-size: 16px; }
.field textarea { resize: vertical; min-height: 70px; }
.field-grid { display: grid; grid-template-columns: 1fr 1fr; }
.field-grid .field:nth-child(2n) { border-left: 1px solid var(--line); }
.field-grid .field:nth-child(-n+2) { border-top: 0; }
details.week { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
details.week > summary { list-style: none; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; cursor: pointer; font-weight: 600; }
details.week > summary::-webkit-details-marker { display: none; }
details.week > summary .chev { transition: transform .2s; }
details.week[open] > summary .chev { transform: rotate(90deg); }
.session-head { padding: 10px 16px 4px; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; border-top: 1px solid var(--line); background: var(--surface-2); }
.flag-where { font-size: 12px; color: var(--muted); }

/* Sheet */
.sheet-backdrop { position: fixed; inset: 0; background: rgba(10, 12, 16, .45); z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: 92%; overflow: auto; border-radius: 18px 18px 0 0; padding: 0 16px calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; }
.sheet-head { position: sticky; top: 0; background: var(--bg); display: flex; justify-content: space-between; align-items: center; padding: 14px 0 8px; z-index: 1; }
.sheet-head h3 { margin: 0; font-family: var(--font-display); font-size: 20px; text-transform: uppercase; }

/* Program */
.segmented { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; overflow-x: auto; }
.segmented button { border: 0; background: none; border-radius: 9px; padding: 8px 6px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.segmented button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.session-card { display: flex; gap: 14px; align-items: center; width: 100%; text-align: left; border: 0; padding: 16px; }
.session-num { font-family: var(--font-display); font-weight: 700; font-size: 44px; line-height: .9; color: var(--accent); min-width: 34px; text-align: center; font-variant-numeric: tabular-nums; }
.session-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.session-body .names { color: var(--muted); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cards { display: flex; flex-direction: column; gap: 10px; }
.danger-zone { display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 10px; }
.danger-zone p { margin: 0; color: var(--muted); font-size: 14px; text-align: center; }
.danger-zone .actions { display: flex; gap: 10px; }

/* Exercise pager */
body.pager-mode main { padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)); }
.pager { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 16px; margin-inline: -16px; padding-inline: 16px; scrollbar-width: none; scroll-padding-inline: 16px; }
.pager::-webkit-scrollbar { display: none; }
.ex-card { flex: 0 0 100%; scroll-snap-align: start; padding: 20px 18px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.ex-name { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1; text-transform: uppercase; letter-spacing: .005em; text-wrap: balance; overflow-wrap: anywhere; }
.ex-partners { color: var(--muted); font-size: 14px; margin: 0; }
.ex-big { font-family: var(--font-display); font-weight: 700; font-size: 76px; line-height: .9; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.ex-big span { color: var(--muted); font-weight: 600; font-size: 52px; padding-inline: 4px; }
.ex-big-caption { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-top: 6px; }
.chips-lg { display: flex; flex-wrap: wrap; gap: 8px; }
.chips-lg .chip { font-size: 20px; padding: 6px 14px; font-family: var(--font-display); font-weight: 700; letter-spacing: .02em; }
.chips-lg .chip small { font-family: var(--font-body); font-size: 11px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.fact { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.fact span { display: block; font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.fact b { font-family: var(--font-display); font-size: 26px; font-variant-numeric: tabular-nums; }
.note-card { border-radius: 12px; padding: 12px 14px; background: var(--surface-2); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
.note-card h4 { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.note-card h4 svg { width: 14px; height: 14px; }
.note-card p { margin: 0; }
.note-tip { background: var(--surface); border-left: 3px solid var(--accent); border-top: 0; border-right: 0; border-bottom: 0; }
.pager-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
}
.pager-bar-inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; }
.round-btn { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.round-btn svg { width: 22px; height: 22px; }
.round-btn:disabled { opacity: .35; cursor: default; }
.round-btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.next-label { min-width: 0; text-align: center; font-size: 13px; color: var(--muted); }
.next-label b { display: block; color: var(--ink); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dots { display: flex; justify-content: center; gap: 5px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--accent); width: 16px; border-radius: 3px; }

/* Registro allenamento */
.log { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); padding-top: 16px; }
.log-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.log-head h3 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 22px; text-transform: uppercase; letter-spacing: .01em; }
.log-count { font-weight: 600; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.log-count.complete { color: var(--kg); }
.last-time { display: flex; flex-direction: column; gap: 8px; background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.lt-head { font-size: 13px; color: var(--muted); }
.lt-head b { display: block; color: var(--ink); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.lt-sets { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; margin: 0; padding: 0; }
.lt-sets li { display: inline-flex; align-items: baseline; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 3px 8px; font-family: var(--font-display); font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lt-sets li small { font-family: var(--font-body); font-size: 11px; font-weight: 700; color: var(--muted); }
.lt-sets li .ok { color: var(--kg); }
.lt-sets li .ko { color: var(--accent); }
.lt-sets li.ko-row { border-color: var(--accent); }
.lt-note { margin: 0; font-size: 13px; color: var(--muted); }
.lt-note strong { color: var(--ink); font-weight: 600; }
.set-row { display: grid; grid-template-columns: 26px minmax(0, 1.4fr) minmax(0, 1fr) 44px 44px; gap: 6px; align-items: center; }
.set-n { font-family: var(--font-display); font-weight: 700; font-size: 22px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
button.set-n { border: 0; background: none; padding: 0; display: grid; place-items: center; height: 48px; color: var(--warn); }
button.set-n svg { width: 18px; height: 18px; }
.set-field { display: flex; align-items: center; gap: 6px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; min-height: 48px; min-width: 0; }
.set-field:focus-within { border-color: var(--accent); }
.set-field input { border: 0; background: none; width: 100%; min-width: 0; padding: 6px 0; font-family: var(--font-display); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; outline: none; }
.set-field input::placeholder { color: var(--muted); opacity: .5; }
.set-field span { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.set-check, .set-miss { width: 44px; height: 48px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--muted); }
.set-check svg, .set-miss svg { width: 22px; height: 22px; }
.set-row.done .set-check { background: var(--kg); border-color: var(--kg); color: var(--surface); }
.set-row.done .set-n { color: var(--kg); }
.set-row.missed .set-miss { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.set-row.missed .set-n { color: var(--accent); }
.set-row.missed .set-field input { text-decoration: line-through; text-decoration-thickness: 2px; }
.text-field textarea.auto { resize: none; overflow: hidden; min-height: 64px; line-height: 1.4; }
.coach-field textarea { border-left: 3px solid var(--accent); }
.coach-box { display: flex; flex-direction: column; gap: 8px; border-radius: 12px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent); }
.cb-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.cb-head b { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.cb-head span { font-size: 12px; color: var(--muted); }
.cb-ai-text { white-space: pre-line; font-size: 15px; line-height: 1.45; }
.cb-ai-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
.cb-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.cb-list li { font-size: 14px; line-height: 1.4; white-space: pre-line; }
.cb-list li small { display: block; font-size: 12px; color: var(--muted); }
.cb-actions { display: flex; flex-wrap: wrap; gap: 4px 16px; }
.cb-actions .link-btn { padding-left: 0; padding-right: 0; }
.cb-status { margin: 0; font-size: 13px; color: var(--muted); }
.cb-status:empty { display: none; }
.notes-preview { font-size: 13px; color: var(--muted); background: var(--surface-2); border: 1px dashed var(--line); border-radius: 10px; padding: 8px 10px; font-variant-numeric: tabular-nums; }
.notes-preview b { display: block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 2px; }
.notes-preview span { color: var(--ink); }
.log-count .miss-count { color: var(--accent); }
.add-set { align-self: flex-start; }
.text-field { display: flex; flex-direction: column; gap: 6px; }
.text-field label { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.text-field textarea { border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); padding: 10px 12px; font-size: 16px; min-height: 64px; resize: vertical; width: 100%; }
.text-field textarea:focus { border-color: var(--accent); outline: none; }
.save-status { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
.save-status.error { color: var(--warn); }
.status-badge { font-size: 13px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.status-done { color: var(--kg); width: 22px; height: 22px; flex: none; }
.session-progress { font-size: 12px; font-weight: 600; color: var(--kg); }
.dots i.done { background: var(--kg); }
.dots i.on { background: var(--accent); }
.log-loading { color: var(--muted); font-size: 14px; display: flex; gap: 8px; align-items: center; }

/* Timer di recupero */
.fact-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.fact-btn { border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 13px; padding: 6px 12px; display: inline-flex; align-items: center; gap: 4px; }
.fact-btn svg { width: 14px; height: 14px; }
.rt-fab { position: fixed; z-index: 26; width: 58px; height: 58px; border-radius: 50%; border: 0; padding: 0; touch-action: none; user-select: none; -webkit-user-select: none;
  background: conic-gradient(var(--accent) calc(var(--p, 0) * 1%), var(--fab-track) 0); box-shadow: 0 6px 18px rgba(0,0,0,.28); display: grid; place-items: center; cursor: grab; }
.rt-fab-in { width: 48px; height: 48px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; pointer-events: none; }
.rt-fab-in svg { width: 24px; height: 24px; }
.rt-fab.dragging { cursor: grabbing; transition: none; box-shadow: 0 12px 28px rgba(0,0,0,.35); }
.rt-fab.snap { transition: left .2s ease, top .2s ease; }
.rt-fab.done { background: var(--kg); animation: rt-pulse 1s ease-in-out infinite; }
.rt-fab.done .rt-fab-in { background: var(--kg); color: var(--surface); }
@keyframes rt-pulse { 50% { transform: scale(1.12); } }
.rt-panel { position: fixed; z-index: 25; width: min(340px, calc(100vw - 24px)); }
.rt-card { max-width: 536px; margin: 0 auto; background: var(--ink); color: var(--bg); border-radius: 18px; padding: 12px 14px 14px; box-shadow: 0 10px 30px rgba(0,0,0,.25); display: flex; flex-direction: column; gap: 10px; }
.rt-panel.done .rt-card { background: var(--kg); color: var(--surface); }
.rt-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; opacity: .85; min-width: 0; }
.rt-top span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.rt-close { border: 0; background: none; color: inherit; width: 32px; height: 32px; display: grid; place-items: center; flex: none; opacity: .8; }
.rt-close svg { width: 18px; height: 18px; }
.rt-main { display: grid; grid-template-columns: 56px 1fr 56px; align-items: center; gap: 8px; }
.rt-time { font-family: var(--font-display); font-weight: 700; font-size: 56px; line-height: 1; text-align: center; font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.rt-adj { height: 48px; border-radius: 14px; border: 1px solid color-mix(in srgb, currentColor 30%, transparent); background: none; color: inherit; font-weight: 700; font-variant-numeric: tabular-nums; }
.rt-bar { height: 4px; border-radius: 2px; background: color-mix(in srgb, currentColor 22%, transparent); overflow: hidden; }
.rt-bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s linear; }
.rt-panel.done .rt-bar i { background: var(--surface); }
.rt-actions { display: flex; gap: 8px; }
.rt-actions button { flex: 1; min-height: 46px; border-radius: 999px; border: 0; font-weight: 700; font-size: 15px; }
.rt-primary { background: var(--accent); color: var(--accent-ink); }
.rt-secondary { background: color-mix(in srgb, currentColor 14%, transparent); color: inherit; }

/* Massimali e peso suggerito */
.maxes-card { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.maxes-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.maxes-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.max-tile { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.max-tile span { display: block; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.max-tile b { font-family: var(--font-display); font-size: 28px; font-variant-numeric: tabular-nums; }
.max-tile b small { font-family: var(--font-body); font-size: 12px; color: var(--muted); font-weight: 600; margin-left: 2px; }
.max-tile.empty b { color: var(--muted); font-size: 20px; }
.max-field { display: grid; grid-template-columns: minmax(0, 1fr) 132px; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); }
.max-field:first-child { border-top: 0; }
.max-field label { font-weight: 600; }
.max-field label small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
.chip-suggest { background: var(--kg-bg); color: var(--kg); }
.suggest { display: flex; flex-direction: column; gap: 8px; background: var(--kg-bg); border-radius: 12px; padding: 12px 14px; }
.suggest-main { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.suggest-main b { font-family: var(--font-display); font-size: 34px; line-height: 1; color: var(--kg); font-variant-numeric: tabular-nums; }
.suggest-main span { font-size: 13px; color: var(--muted); }
.suggest-label { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--kg); }
.suggest-base { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.suggest-base select { font-size: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 4px 6px; color: var(--ink); }
.suggest.missing { background: var(--surface-2); }

/* Backup */
.backup-card { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.backup-card .actions { display: flex; flex-wrap: wrap; gap: 10px; }
.backup-confirm { background: var(--surface-2); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }

/* Export */
.export-card { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.export-card .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.export-status { font-size: 13px; color: var(--muted); margin: 0; }
.export-format { max-width: 240px; }
.export-status.ok { color: var(--kg); }
.export-status.error { color: var(--warn); }

/* Data sessione e calendario */
.session-date { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; }
.session-date > div { min-width: 0; }
.session-date input[type="date"] { border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); padding: 8px 10px; font-size: 16px; min-width: 0; max-width: 46%; }
.cal { padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.cal-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.cal-head h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 24px; text-transform: uppercase; letter-spacing: .01em; }
.cal-nav { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--ink); }
.cal-nav svg { width: 18px; height: 18px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-dow { text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding: 4px 0; }
.cal-day { aspect-ratio: 1; max-width: 100%; border: 0; background: none; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink); padding: 0; }
.cal-day.out { visibility: hidden; }
.cal-day.has { background: var(--surface-2); }
.cal-day .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.cal-day .dot.none { background: transparent; }
.cal-day.today { box-shadow: inset 0 0 0 2px var(--line); }
.cal-day.selected { background: var(--accent); color: var(--accent-ink); }
.cal-day.selected .dot { background: var(--accent-ink); }
.cal-day.selected .dot.none { background: transparent; }
.date-badge { flex: none; width: 46px; text-align: center; display: flex; flex-direction: column; line-height: 1; }
.date-badge b { font-family: var(--font-display); font-size: 26px; font-variant-numeric: tabular-nums; }
.date-badge span { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); letter-spacing: .06em; }
.empty-note { color: var(--muted); font-size: 14px; padding: 4px; margin: 0; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
</style>
</head>

<script id="exporter">
/* ===== Export PDF =====
   Ridisegna la tabella della scheda del coach (stesse colonne e colori) con
   Feedback e Note compilati. Una pagina (o più) per settimana. */
var SchedaExport = (function () {
  // Bordi delle colonne in punti, come nel PDF del coach (A4, 595 × 842 pt)
  var X = [53, 118.5, 141.5, 164, 189.5, 219.5, 240, 265, 295, 381, 441.5, 532.5];
  var LABELS = ["Esercizio", "Serie", "Rip.", "%1RM", "Carico (kg)", "RPE", "Rec.", "Volume", "Tip tecniche", "Feedback", "Note"];
  var CENTER = [false, true, true, true, true, true, true, true, false, false, false];
  var FS = 5.2, LH = 6.6, PAD = 1.6, BAND = 6.6, TOP = 56, BOTTOM = 800;
  var GREEN = [217, 234, 211], BLUE = [31, 78, 120], INK = [20, 24, 32], MUTED = [105, 113, 124];
  var ALLOWED = /[^\n -~ -ÿ–—‘’“”•…€✓✗]/g;

  function clean(t) { return String(t == null ? "" : t).replace(/\r/g, "").replace(ALLOWED, ""); }

  function build(jsPDF, fonts, o) {
    var doc = new jsPDF({ unit: "pt", format: "a4", compress: true });
    doc.addFileToVFS("dv.ttf", fonts.regular); doc.addFont("dv.ttf", "DV", "normal");
    doc.addFileToVFS("dvb.ttf", fonts.bold); doc.addFont("dvb.ttf", "DV", "bold");
    doc.setProperties({ title: o.title, creator: "Scheda" });
    doc.setLineHeightFactor(LH / FS);
    var p = o.program, firstPage = true, y = TOP;

    function font(style, size, color) { doc.setFont("DV", style); doc.setFontSize(size); doc.setTextColor(color[0], color[1], color[2]); }
    function newPage() { doc.addPage(); y = TOP; }
    function header() {
      doc.setFillColor(BLUE[0], BLUE[1], BLUE[2]); doc.rect(X[0], y, X[11] - X[0], BAND, "F");
      font("bold", FS, [255, 255, 255]);
      LABELS.forEach(function (l, i) { doc.text(l, (X[i] + X[i + 1]) / 2, y + 0.9, { align: "center", baseline: "top" }); });
      y += BAND;
    }
    function grid(top, bottom) {
      doc.setDrawColor(204, 204, 204); doc.setLineWidth(0.5);
      X.forEach(function (x) { doc.line(x, top, x, bottom); });
      doc.line(X[0], bottom, X[11], bottom);
    }
    // Lascio un po' di margine a destra: il testo resta ben dentro la sua colonna anche se il PDF viene reimportato.
    function cellLines(text, i) { return doc.splitTextToSize(clean(text), X[i + 1] - X[i] - 2 * PAD - 3); }

    o.weeks.forEach(function (wi) {
      var w = p.weeks[wi];
      if (!firstPage) newPage(); firstPage = false;
      font("bold", 7.1, INK);
      doc.text("SETTIMANA " + w.number, X[0] + 1, y, { baseline: "top" });
      font("normal", FS, MUTED);
      doc.text(clean(o.subtitle), X[11], y + 1.5, { align: "right", baseline: "top" });
      y += 14;

      w.sessions.forEach(function (s, si) {
        var rows = [], inSS = null;
        s.exercises.forEach(function (e, ei) {
          if (e.supersetGroup != null && e.supersetGroup !== inSS) rows.push({ superset: true });
          inSS = e.supersetGroup != null ? e.supersetGroup : null;
          rows.push({
            values: [e.name, e.sets, e.reps, e.percent, e.load, e.rpe, e.rest, e.volume, e.tip,
              o.feedbackFor(wi, si, ei, e), o.noteFor(wi, si, ei, e)]
          });
        });
        // Altezza di ogni riga: la cella con più righe di testo
        font("normal", FS, INK);
        rows.forEach(function (r) {
          if (r.superset) { r.h = LH + 1.5; return; }
          r.lines = r.values.map(function (v, i) { return cellLines(v, i); });
          r.h = Math.max.apply(null, r.lines.map(function (l) { return Math.max(1, l.length); })) * LH + 1.5;
        });

        var needed = BAND * 2 + (rows[0] ? rows[0].h : 0);
        if (y + needed > BOTTOM) newPage();

        // Fascia verde con numero sessione e data di esecuzione
        doc.setFillColor(GREEN[0], GREEN[1], GREEN[2]); doc.rect(X[0], y, X[11] - X[0], BAND, "F");
        font("bold", FS, INK);
        doc.text("SESSIONE " + s.number, X[0] + 1, y + 0.9, { baseline: "top" });
        var date = o.dateFor(wi, si);
        if (date) { font("normal", FS, INK); doc.text(clean("Svolta " + date), X[11] - 1.5, y + 0.9, { align: "right", baseline: "top" }); }
        y += BAND;
        header();
        var top = y;

        rows.forEach(function (r) {
          if (y + r.h > BOTTOM) { grid(top, y); newPage(); header(); top = y; }
          if (r.superset) {
            font("bold", FS, INK);
            doc.text("SUPERSET:", X[0] + PAD, y + 0.8, { baseline: "top" });
          } else {
            r.lines.forEach(function (lines, i) {
              if (!lines.length || (lines.length === 1 && !lines[0])) return;
              font("normal", FS, INK);
              var x = CENTER[i] ? (X[i] + X[i + 1]) / 2 : X[i] + PAD;
              doc.text(lines, x, y + 0.8, { baseline: "top", align: CENTER[i] ? "center" : "left" });
            });
          }
          y += r.h;
          doc.setDrawColor(232, 232, 232); doc.setLineWidth(0.3);
          doc.line(X[0], y, X[11], y);
        });
        grid(top, y);
        y += 12;
      });
    });
    return doc;
  }

  return { build: build };
})();
</script>


<script id="exporter-xlsx">
/* ===== Export Excel =====
   Stessa tabella del PDF (colonne, fasce verdi delle sessioni, intestazione blu),
   un foglio per settimana, con celle vere: si modifica comodamente dal PC. */
var SchedaXlsx = (function () {
  var LABELS = ["Esercizio", "Serie", "Rip.", "%1RM", "Carico (kg)", "RPE", "Rec.", "Volume", "Tip tecniche", "Feedback", "Note", "Feedback coach"];
  var WIDTHS = [30, 7, 7, 8, 11, 7, 8, 9, 34, 32, 32, 40];
  var CENTER = [false, true, true, true, true, true, true, true, false, false, false, false];
  var NC = LABELS.length;
  var GREEN = "FFD9EAD3", BLUE = "FF1F4E78", LINE = "FFCCCCCC", INK = "FF141820", MUTED = "FF69717C";
  var thin = { style: "thin", color: { argb: LINE } };
  var BORDER = { top: thin, left: thin, bottom: thin, right: thin };

  function txt(v) { return String(v == null ? "" : v).replace(/\r/g, "").trim(); }
  // I numeri restano numeri (così su Excel si possono sommare); il resto è testo.
  function val(v) {
    var t = txt(v);
    if (/^-?\d+([.,]\d+)?$/.test(t)) return Number(t.replace(",", "."));
    return t;
  }
  function sheetName(t, used) {
    var n = String(t).replace(/[\\\/?*\[\]:]/g, "-").slice(0, 31) || "Foglio", base = n, k = 2;
    while (used[n.toLowerCase()]) n = base.slice(0, 28) + " " + (k++);
    used[n.toLowerCase()] = true; return n;
  }
  function linesIn(v, width) {
    return txt(v).split("\n").reduce(function (a, l) { return a + Math.max(1, Math.ceil(l.length / Math.max(4, width - 1))); }, 0);
  }

  function build(ExcelJS, o) {
    var wb = new ExcelJS.Workbook(), p = o.program, used = {};
    wb.creator = "Scheda"; wb.created = new Date();
    o.weeks.forEach(function (wi) {
      var w = p.weeks[wi];
      var ws = wb.addWorksheet(sheetName("Settimana " + w.number, used), {
        pageSetup: { paperSize: 9, orientation: "landscape", fitToPage: true, fitToWidth: 1, fitToHeight: 0, margins: { left: 0.4, right: 0.4, top: 0.5, bottom: 0.5, header: 0.2, footer: 0.2 } },
        views: [{ showGridLines: false }]
      });
      ws.columns = WIDTHS.map(function (wd) { return { width: wd }; });

      var r = ws.addRow(["SETTIMANA " + w.number]);
      r.font = { bold: true, size: 14, color: { argb: INK } }; r.height = 22;
      r = ws.addRow([txt(o.subtitle)]);
      r.font = { size: 9, color: { argb: MUTED } };
      ws.addRow([]);

      w.sessions.forEach(function (sess, si) {
        // Fascia verde: sessione e data
        r = ws.addRow(["SESSIONE " + sess.number]);
        var date = o.dateFor(wi, si);
        if (date) r.getCell(NC).value = "Svolta " + date;
        for (var c = 1; c <= NC; c++) {
          var cell = r.getCell(c);
          cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: GREEN } };
          cell.font = { bold: c === 1, size: 10, color: { argb: INK } };
        }
        r.getCell(NC).alignment = { horizontal: "right" };
        // Intestazione blu
        r = ws.addRow(LABELS);
        r.eachCell(function (cell) {
          cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: BLUE } };
          cell.font = { bold: true, size: 10, color: { argb: "FFFFFFFF" } };
          cell.alignment = { horizontal: "center", vertical: "middle", wrapText: true };
          cell.border = BORDER;
        });
        var inSS = null;
        sess.exercises.forEach(function (e, ei) {
          if (e.supersetGroup != null && e.supersetGroup !== inSS) {
            r = ws.addRow(["SUPERSET:"]);
            r.getCell(1).font = { bold: true, size: 10 };
            for (var c2 = 1; c2 <= NC; c2++) r.getCell(c2).border = BORDER;
          }
          inSS = e.supersetGroup != null ? e.supersetGroup : null;
          var values = [e.name, e.sets, e.reps, e.percent, e.load, e.rpe, e.rest, e.volume, e.tip, o.feedbackFor(wi, si, ei, e), o.noteFor(wi, si, ei, e), o.coachFor ? o.coachFor(wi, si, ei, e) : ""];
          r = ws.addRow(values.map(function (v, i) { return i === 0 || i >= 8 ? txt(v) : val(v); }));
          var lines = 1;
          values.forEach(function (v, i) {
            var cell = r.getCell(i + 1);
            cell.alignment = { horizontal: CENTER[i] ? "center" : "left", vertical: "top", wrapText: true };
            cell.font = { size: 10, color: { argb: INK } };
            cell.border = BORDER;
            lines = Math.max(lines, linesIn(v, WIDTHS[i]));
          });
          r.height = Math.max(15, lines * 13 + 2);
        });
        ws.addRow([]);
      });
    });
    return wb;
  }

  return { build: build };
})();
</script>

<script id="parser">
/* ===== Parser della scheda del coach =====
   Il PDF non ha celle, solo testo posizionato. Prendo ogni carattere con la
   sua posizione, raggruppo i caratteri in righe, li assegno a una colonna in
   base al centro orizzontale (bordi ricavati dalla riga di intestazione) e
   tratto le righe senza "Serie" come testo andato a capo. */
var SchedaParser = (function () {
  var COLUMNS = ["Esercizio", "Serie", "Rip.", "%1RM", "Carico", "RPE", "Rec.", "Volume", "Tip", "Feedback", "Note"];
  var KEYS = ["name", "sets", "reps", "percent", "load", "rpe", "rest", "volume", "tip", "feedback", "note"];
  // Distanza tra l'inizio dell'intestazione e il bordo sinistro della colonna,
  // misurata sul template del coach (le intestazioni sono centrate nelle celle).
  var HEADER_OFFSET = { "Serie": 6.5, "Rip.": 7.5, "%1RM": 6, "Carico": 4.5, "RPE": 6.5, "Rec.": 8, "Volume": 7, "Tip": 31, "Feedback": 21, "Note": 40.5 };
  var WORD_GAP = 0.5; // tra lettere ~0 pt, tra parole ~1.2 pt (font 4.9 pt)

  // items: elementi di pdf.js getTextContent() → caratteri con posizione
  function glyphsFromItems(items) {
    var out = [], pendingSpace = false;
    items.forEach(function (it) {
      var s = it.str || "";
      if (!s) { if (it.hasEOL) pendingSpace = true; return; }
      var t = it.transform, x = t[4], y = t[5];
      var size = Math.hypot(t[2], t[3]) || Math.abs(t[3]) || 5;
      // Se pdf.js restituisce più caratteri insieme, divido la larghezza in proporzione
      // alla larghezza tipica di ogni carattere (stretti come "i", larghi come "m" o "%").
      var chars = Array.from(s);
      var weights = chars.map(charWeight), total = weights.reduce(function (a, b) { return a + b; }, 0) || 1;
      var unit = (it.width || 0) / total, cx = x;
      chars.forEach(function (c, i) {
        var cw = weights[i] * unit, x0 = cx;
        cx += cw;
        if (!c.trim()) { pendingSpace = true; return; }
        out.push({ t: c, x0: x0, x1: x0 + cw, y: y, size: size, sp: pendingSpace });
        pendingSpace = false;
      });
      if (it.hasEOL) pendingSpace = true;
    });
    return out;
  }

  // Larghezze approssimate (in millesimi di em, stile Helvetica)
  function charWeight(c) {
    if (/[ijl'|.,:;!]/.test(c)) return 240;
    if (/[ftrI\s()\[\]\-]/.test(c)) return 320;
    if (/[mwMW%]/.test(c)) return 860;
    if (/[A-Z]/.test(c)) return 680;
    if (/[0-9]/.test(c)) return 556;
    return 520;
  }

  function linesOf(glyphs) {
    if (!glyphs.length) return [];
    var sorted = glyphs.slice().sort(function (a, b) { return b.y - a.y; });
    var sizes = glyphs.map(function (g) { return g.size; }).sort(function (a, b) { return a - b; });
    var tol = Math.max(1, sizes[Math.floor(sizes.length / 2)] * 0.35);
    var lines = [], center = null;
    sorted.forEach(function (g) {
      var last = lines[lines.length - 1];
      if (last && Math.abs(g.y - center) <= tol) {
        last.push(g); center += (g.y - center) / last.length;
      } else { lines.push([g]); center = g.y; }
    });
    return lines.map(function (l) { return l.sort(function (a, b) { return a.x0 - b.x0; }); });
  }

  function join(glyphs, ignoreFirstSpace) {
    var s = "", prev = null;
    glyphs.forEach(function (g, i) {
      if (prev !== null && (g.x0 - prev > WORD_GAP || (g.sp && !(ignoreFirstSpace && i === 0)))) s += " ";
      s += g.t; prev = g.x1;
    });
    return s.trim();
  }

  function columnBorders(header) {
    var borders = [], missing = [], from = 0;
    COLUMNS.slice(1).forEach(function (label) {
      var chars = Array.from(label), found = -1;
      for (var i = from; i <= header.length - chars.length; i++) {
        var ok = true;
        for (var k = 0; k < chars.length; k++) if (header[i + k].t !== chars[k]) { ok = false; break; }
        if (ok) { found = i; break; }
      }
      if (found < 0) missing.push(label);
      else { borders.push(header[found].x0 - (HEADER_OFFSET[label] || 0)); from = found + chars.length; }
    });
    if (missing.length) throw new Error("L'intestazione della tabella non è quella attesa (mancano: " + missing.join(", ") + ").");
    return borders;
  }

  function cells(line, borders) {
    var buckets = COLUMNS.map(function () { return []; });
    line.forEach(function (g) {
      var mid = (g.x0 + g.x1) / 2, col = 0;
      borders.forEach(function (b) { if (mid >= b) col++; });
      buckets[col].push(g);
    });
    return buckets.map(function (b) { return join(b, true); });
  }

  function numberAfter(keyword, text) {
    var m = new RegExp("^" + keyword + "\\s*(\\d+)", "i").exec(text);
    return m ? parseInt(m[1], 10) : null;
  }

  function emptyExercise(values) {
    var e = { supersetGroup: null };
    KEYS.forEach(function (k, i) { e[k] = values[i] || ""; });
    return e;
  }

  // pages: array di array di item pdf.js, una per pagina
  function parse(pages, fileName) {
    var weeks = [], borders = null, ssCounter = 0, inSS = false;
    pages.forEach(function (items) {
      linesOf(glyphsFromItems(items)).forEach(function (line) {
        var text = join(line);
        var n = numberAfter("SETTIMANA", text);
        if (n !== null) { weeks.push({ number: n, sessions: [] }); return; }
        n = numberAfter("SESSIONE", text);
        if (n !== null) {
          if (!weeks.length) weeks.push({ number: 1, sessions: [] });
          weeks[weeks.length - 1].sessions.push({ number: n, exercises: [] });
          inSS = false; return;
        }
        if (/^Esercizio/.test(text)) { borders = columnBorders(line); return; }
        if (!borders || !weeks.length) return;
        var week = weeks[weeks.length - 1];
        var session = week.sessions[week.sessions.length - 1];
        if (!session) return;

        var values = cells(line, borders);
        var rest = values.slice(1).every(function (v) { return !v; });
        if (rest && values[0].toUpperCase().replace(/[:\s]+$/, "") === "SUPERSET") { ssCounter++; inSS = true; return; }

        if (values[1]) {
          var ex = emptyExercise(values);
          ex.supersetGroup = inSS ? ssCounter : null;
          session.exercises.push(ex);
        } else if (session.exercises.length) {
          var cur = session.exercises[session.exercises.length - 1];
          KEYS.forEach(function (k, i) { if (values[i]) cur[k] = cur[k] ? cur[k] + " " + values[i] : values[i]; });
        }
      });
    });
    var count = 0;
    weeks.forEach(function (w) { w.sessions.forEach(function (s) { count += s.exercises.length; }); });
    if (!count) throw new Error("Non ho trovato esercizi nel PDF. Il formato potrebbe essere diverso da quello della scheda del coach.");
    var base = (fileName || "Scheda").replace(/\.pdf$/i, "").replace(/[_]+/g, " ").replace(/\s+/g, " ").trim();
    return { title: base || "Scheda", fileName: fileName || "", weeks: weeks };
  }

  function numbersIn(text) {
    return (String(text || "").match(/\d+(?:[.,]\d+)?/g) || []).map(function (s) { return parseFloat(s.replace(",", ".")); });
  }

  function issues(e) {
    var out = [];
    if (!e.name) out.push("Nome esercizio mancante");
    if (!e.sets) out.push("Numero di serie mancante");
    else if (!/^\d+$/.test(e.sets)) out.push("Serie non numeriche: \"" + e.sets + "\"");
    if (!e.reps) out.push("Ripetizioni mancanti");
    if (numbersIn(e.percent).some(function (v) { return v < 30 || v > 110; }))
      out.push("Percentuale insolita (" + e.percent + "): probabile refuso, verifica con il coach");
    var r = numbersIn(e.rpe)[0];
    if (r !== undefined && (r < 1 || r > 10)) out.push("RPE fuori scala (" + e.rpe + ")");
    return out;
  }

  // "1.30\"" e "2.30'" significano minuti.secondi; "2\"" = 2 minuti. Il resto resta com'è.
  function restDisplay(rest) {
    if (!rest) return "";
    var t = rest.replace(/["'’”\s]/g, "");
    var m = /^(\d+)(?:\.(\d+))?$/.exec(t);
    if (!m) return rest;
    var sec = m[2] ? parseInt(m[2], 10) : 0;
    return sec ? m[1] + "'" + String(sec).padStart(2, "0") + "\"" : m[1] + "'";
  }

  return { parse: parse, issues: issues, restDisplay: restDisplay };
})();
</script>

    var select = '<select data-lift-for="' + esc(normName(e.name)) + '" aria-label="Massimale su cui calcolare la percentuale">' +
      '<option value="none"' + (!sug.lift ? " selected" : "") + '>Nessuno</option>' +
      LIFTS.map(function (l) { return '<option value="' + l.id + '"' + (sug.lift === l.id ? " selected" : "") + '>' + l.name + (maxOf(l.id) ? " (" + fmtKg(String(maxOf(l.id))) + " kg)" : "") + '</option>'; }).join("") + '</select>';
    if (sug.kgs) {
      return '<div class="suggest"><span class="suggest-label">Peso suggerito</span><div class="suggest-main"><b>' + esc(sug.text) + ' kg</b>' +
        '<span>' + esc(e.percent) + ' di ' + esc(liftName(sug.lift).toLowerCase()) + ' ' + esc(fmtKg(String(sug.max))) + ' kg</span></div>' +
        '<div class="suggest-base">Calcolato su ' + select + '</div></div>';
    }
    if (sug.missing) {
      return '<div class="suggest missing"><div class="suggest-base">Per il peso suggerito serve il massimale di <strong>' + esc(liftName(sug.lift)) + '</strong>.</div>' +
        '<button class="btn btn-ghost btn-small" data-action="open-maxes">Inserisci i massimali</button>' +
        '<div class="suggest-base">Calcolato su ' + select + '</div></div>';
    }
    return '<div class="suggest missing"><div class="suggest-base">Su quale massimale calcolo il ' + esc(e.percent) + '? ' + select + '</div></div>';
  }

  var maxesTimer = null;

    state.maxesStatus = "Modifiche…"; var el = document.getElementById("maxes-status"); if (el) el.textContent = state.maxesStatus;

      store.saveMaxes(state.maxes).then(function () { state.maxesStatus = "Salvato"; }).catch(function () { state.maxesStatus = "Non salvato, riprova"; })

      ' Se un esercizio viene abbinato al massimale sbagliato, lo cambi dalla sua scheda (\"Calcolato su\").</p>';

  function kgPlaceholder(e, en, i, last) {
    if (en) for (var j = Math.min(i, en.sets.length) - 1; j >= 0; j--) if (en.sets[j] && en.sets[j].kg) return en.sets[j].kg;
    // Poi il peso calcolato dal massimale (il valore più basso se la % è un intervallo)
    var sug = suggestion(e);
    if (sug && sug.kgs) return sug.kgs[0];
    if (last && last.entry.sets[i] && last.entry.sets[i].kg) return last.entry.sets[i].kg;
    var m = /^(\d+(?:[.,]\d+)?)\s*kg$/i.exec((e.load || "").trim());
    return m ? m[1] : "";
  }

  function logBlock(p, wi, si, ei) {
    var e = p.weeks[wi].sessions[si].exercises[ei];
    var key = entryKey(wi, si, ei);
    var attrs = 'class="log" data-w="' + wi + '" data-s="' + si + '" data-e="' + ei + '"';
    if (!state.logsLoaded[p.id]) {
      return '<section ' + attrs + '><div class="log-loading"><div class="spinner"></div>Carico il tuo registro…</div></section>';
    }
    var en = getEntry(p.id, key, e, false);
    var last = lastTime(p, wi, si, e);
    var total = prescribedSets(e), done = doneCount(en), missed = missedCount(en);
    var h = '<section ' + attrs + ' aria-label="Il tuo allenamento">';
    h += '<div class="log-head"><h3>Il tuo allenamento</h3><span class="log-count' + (done >= total ? " complete" : "") + '">' + done + '/' + total + ' serie' + (missed ? ' <span class="miss-count">· ' + missed + (missed === 1 ? ' sbagliata' : ' sbagliate') + '</span>' : '') + '</span></div>';
    h += coachBoxHtml(p, wi, si, e);
    if (last) {
      h += lastTimeHtml(last);
    }
    var rows = rowCount(e, en);
    for (var i = 0; i < rows; i++) {
      var s = en && en.sets[i] ? en.sets[i] : { kg: "", reps: "", done: false, missed: false };
      var extra = i >= total;
      var idBase = "log-" + key + "-" + i;
      h += '<div class="set-row' + (s.done ? " done" : s.missed ? " missed" : "") + '" data-set="' + i + '">' +
        (extra
          ? '<button class="set-n" data-action="remove-set" aria-label="Rimuovi serie ' + (i + 1) + '">' + ICON.minus + '</button>'
          : '<span class="set-n" aria-hidden="true">' + (i + 1) + '</span>') +
        '<label class="set-field" for="' + idBase + '-kg"><input id="' + idBase + '-kg" data-log-field="kg" inputmode="decimal" autocomplete="off" aria-label="Serie ' + (i + 1) + ', chili" placeholder="' + esc(fmtKg(kgPlaceholder(e, en, i, last))) + '" value="' + esc(s.kg ? fmtKg(s.kg) : "") + '"><span>kg</span></label>' +
        '<label class="set-field" for="' + idBase + '-reps"><input id="' + idBase + '-reps" data-log-field="reps" inputmode="numeric" autocomplete="off" aria-label="Serie ' + (i + 1) + ', rep fatte" placeholder="' + esc(e.reps) + '" value="' + esc(s.reps) + '"><span>rep</span></label>' +
        '<button class="set-check" data-action="toggle-set" aria-pressed="' + !!s.done + '" aria-label="Serie ' + (i + 1) + ' riuscita">' + ICON.check + '</button>' +
        '<button class="set-miss" data-action="miss-set" aria-pressed="' + !!s.missed + '" aria-label="Serie ' + (i + 1) + ' sbagliata">' + ICON.cross + '</button>' +
        '</div>';
    }
    h += '<button class="link-btn add-set" data-action="add-set">' + ICON.plus + 'Aggiungi serie</button>';
    h += '<div class="text-field"><label for="log-' + key + '-feedback">Feedback</label><textarea class="auto" id="log-' + key + '-feedback" data-log-field="feedback" rows="2" placeholder="Come è andata, sensazioni, tecnica">' + esc(en ? en.feedback : e.feedback) + '</textarea></div>';
    h += '<div class="text-field coach-field"><label for="log-' + key + '-coach">Feedback della coach</label><textarea class="auto" id="log-' + key + '-coach" data-log-field="coach" rows="2" placeholder="Cosa ti ha detto sui video">' + esc(en ? en.coach || "" : "") + '</textarea></div>';
    h += '<div class="notes-preview" aria-live="polite">' + previewHtml(e, en) + '</div>';
    return h + '</section>';
  }

  function sectionContext(section) {
    var p = currentProgram(); if (!p || !section) return null;
    var wi = Number(section.dataset.w), si = Number(section.dataset.s), ei = Number(section.dataset.e);
    var e = p.weeks[wi].sessions[si].exercises[ei];
    return { p: p, wi: wi, si: si, ei: ei, e: e, key: entryKey(wi, si, ei) };
  }

  function rerenderLog(section, focusSelector) {
    var c = sectionContext(section); if (!c) return;
    section.outerHTML = logBlock(c.p, c.wi, c.si, c.ei);
    var fresh = app.querySelector('.log[data-w="' + c.wi + '"][data-s="' + c.si + '"][data-e="' + c.ei + '"]');
    if (fresh) autosizeAll(fresh);
    if (focusSelector) {
      var el = fresh && fresh.querySelector(focusSelector);
      if (el) el.focus({ preventScroll: true });
    }
    updatePagerChrome();
  }

  // Salvataggio automatico: una scrittura alla volta, poco dopo l'ultima modifica.
  var saveQueue = {};
  function setSaveStatus(s) {
    state.saveStatus = s;
    var el = document.getElementById("save-status");
    if (!el) return;
    var text = { pending: "Modifiche…", saving: "Salvo…", saved: "Salvato", error: "Non salvato" }[s] || "";
    el.textContent = text;
    el.classList.toggle("error", s === "error");
  }
  function scheduleSave(pid) {
    var q = saveQueue[pid] || (saveQueue[pid] = {});
    q.dirty = true; setSaveStatus("pending");
    clearTimeout(q.timer);
    q.timer = setTimeout(function () { flushSave(pid); }, 700);
  }
  function flushSave(pid) {
    var q = saveQueue[pid];
    if (!q || !q.dirty || q.saving) return;
    clearTimeout(q.timer);
    q.dirty = false; q.saving = true; setSaveStatus("saving");
    store.saveLogs(pid, state.logs[pid] || {}, state.sessionDates[pid] || {}).then(function () {
      q.saving = false;
      if (q.dirty) flushSave(pid); else setSaveStatus("saved");
    }).catch(function () {
      q.saving = false; q.dirty = true; setSaveStatus("error");
      q.timer = setTimeout(function () { flushSave(pid); }, 4000);
    });
  }
  function flushAll() { Object.keys(saveQueue).forEach(flushSave); }

  function loadLogs(pid) {
    if (state.logsLoaded[pid] || state.logsLoading[pid]) return;
    state.logsLoading[pid] = true;
    function done() {
      state.logsLoaded[pid] = true; delete state.logsLoading[pid];
      if (state.programId === pid || state.view === "calendar") render();
    }
    store.getLogs(pid).then(function (r) {
      state.logs[pid] = (r && r.entries) || {};
      // Le note scritte a mano finiscono nel Feedback (le Note ora sono automatiche)
      Object.keys(state.logs[pid]).forEach(function (k) {
        var en = state.logs[pid][k], n = en && (en.note || "").trim();
        if (!n) { if (en) delete en.note; return; }
        var fb = (en.feedback || "").trim();
        en.feedback = fb && fb.indexOf(n) < 0 ? fb + "\n" + n : fb || n;
        delete en.note;
      });
      state.sessionDates[pid] = (r && r.sessions) || {};
      done();
    }).catch(function () {
      state.logs[pid] = {}; state.sessionDates[pid] = {};
      done();
    });
  }

  function exerciseStatus(p, wi, si, ei) {
    if (!state.logsLoaded[p.id]) return "";
    var e = p.weeks[wi].sessions[si].exercises[ei];
    var en = getEntry(p.id, entryKey(wi, si, ei), e, false);
    var d = doneCount(en);
    if (!d) return "";
    return isComplete(e, en) ? ICON.checkCircle : '<span class="status-badge">' + d + '/' + prescribedSets(e) + '</span>';
  }

  /* ---------- Viste ---------- */

          '<div class="program-title">' + esc(p.title) + '</div>' +
          '<div class="row-sub">' + plural(p.weeks.length, "settimana", "settimane") + ' · ' + plural(countSessions(p), "sessione", "sessioni") + ' · ' + plural(countExercises(p), "esercizio", "esercizi") + '</div>' +

  function viewReview() {
    var p = state.pending;
    var h = topbar('<button class="link-btn" data-action="cancel-import">Annulla</button>', "Controlla", '<button class="link-btn" data-action="save-import"><strong>Salva</strong></button>');

      '<div class="stat"><b>' + p.weeks.length + '</b><span>Settimane</span></div>' +

          '<div class="row-title">' + esc(e.name) + '</div>' +

          '</div>' + ICON.chev + '</button>';

  function viewProgram() {
    var p = currentProgram();
    if (!p) { state.view = "home"; return viewHome(); }
    var weeks = sortedWeeks(p);
    if (state.week >= weeks.length) state.week = 0;
    var w = weeks[state.week];
    var h = topbar(backBtn("go-home", "Schede"), p.title, '<button class="link-btn" data-action="open-calendar" aria-label="Calendario">' + ICON.cal + '</button>');
    h += "<main>";
    if (weeks.length > 1) {
      h += '<div class="segmented" role="group" aria-label="Settimana">';
      weeks.forEach(function (wk, i) {
        h += '<button data-action="pick-week" data-i="' + i + '" aria-pressed="' + (i === state.week) + '">' + (weeks.length <= 5 ? "Sett. " : "") + wk.number + '</button>';
      });
      h += '</div>';
    }
    h += '<div><p class="section-label">Settimana ' + w.number + '</p><div class="cards">';
    var wi = p.weeks.indexOf(w);
    w.sessions.slice().sort(function (a, b) { return a.number - b.number; }).forEach(function (s) {

      var completed = 0, started = false;
      if (state.logsLoaded[p.id]) {
        s.exercises.forEach(function (e, ei) {
          var en = getEntry(p.id, entryKey(wi, idx, ei), e, false);
          if (doneCount(en)) started = true;
          if (isComplete(e, en)) completed++;
        });
      }
      var allDone = s.exercises.length && completed === s.exercises.length;
      h += '<button class="card session-card" data-action="open-session" data-i="' + idx + '"><div class="session-num">' + s.number + '</div>' +
        '<div class="session-body"><div class="row-title">Sessione ' + s.number + ' <span class="row-sub">· ' + plural(s.exercises.length, "esercizio", "esercizi") + '</span></div>' +
        '<div class="names">' + esc(s.exercises.map(function (e) { return e.name; }).join(" · ")) + '</div>' +
        (function () {
          var d = state.logsLoaded[p.id] ? datesOf(p.id)[sessionKey(wi, idx)] : "";
          var parts = [];
          if (d) parts.push(fmtDate(d));
          if (started) parts.push(allDone ? "completata" : completed + " di " + s.exercises.length + " esercizi completati");
          return parts.length ? '<div class="session-progress">' + esc(parts.join(" · ").replace(/^./, function (c) { return c.toUpperCase(); })) + '</div>' : "";
        })() +
        '</div>' + (allDone ? ICON.checkCircle : ICON.chev) + '</button>';
    });
    h += '</div></div>';
    var xl = state.exportFormat === "xlsx";
    h += '<div class="card export-card"><div><div class="row-title">Esporta per il coach</div>' +

  function currentSession() {

  }

  function blocks(exercises) {
    var out = [], prev;
    exercises.forEach(function (e, i) {
      var g = e.supersetGroup == null ? null : e.supersetGroup;
      if (out.length && g === prev) out[out.length - 1].push(i); else out.push([i]);
      prev = g;
    });
    return out;
  }

  function viewExercise() {

  /* ---------- Backup ---------- */
  function backupCard() {
    var h = '<div class="card backup-card"><div><div class="row-title">Backup</div><div class="row-sub">' +
      (store.mode === "local"
        ? "Le schede e il registro sono salvati solo in questo browser. Scarica ogni tanto un backup: ti serve per non perdere niente o per passare a un altro telefono."
        : "Un file con tutte le schede, i pesi, le note e le date. Puoi ripristinarlo qui o nella versione sito dell'app.") +
      '</div></div>';
    if (state.backupPending) {
      var bp = state.backupPending;
      h += '<div class="backup-confirm"><div>Il backup del ' + esc(bp.date) + ' contiene ' + plural(bp.programs.length, "scheda", "schede") +
        (bp.replace ? " (" + bp.replace + " già " + (bp.replace === 1 ? "presente: verrà sostituita" : "presenti: verranno sostituite") + " con la versione del backup, registro compreso)" : "") +
        '.</div><div class="actions"><button class="btn btn-ghost btn-small" data-action="backup-cancel">Annulla</button>' +
        '<button class="btn btn-primary btn-small" data-action="backup-restore">Ripristina</button></div></div>';
    } else {
      h += '<div class="actions"><button class="btn btn-ghost btn-small" data-action="backup-export">' + ICON.download + 'Scarica backup</button>' +
        '<button class="btn btn-ghost btn-small" data-action="backup-import">Ripristina backup</button></div>';
    }
    h += '<p class="export-status ' + (state.backupStatus ? state.backupStatus.kind : "") + '" id="backup-status" role="status">' + (state.backupStatus ? esc(state.backupStatus.text) : "") + '</p>';
    return h + '</div>';
  }
  function setBackupStatus(text, kind) {
    state.backupStatus = text ? { text: text, kind: kind || "" } : null;
    var el = document.getElementById("backup-status");
    if (el) { el.textContent = text || ""; el.className = "export-status " + (kind || ""); }
  }

  function exportBackup() {
    flushAll();
    var programs = state.programs.slice();
    Promise.all(programs.map(function (p) {
      return state.logsLoaded[p.id]
        ? Promise.resolve({ entries: state.logs[p.id] || {}, sessions: state.sessionDates[p.id] || {} })
        : store.getLogs(p.id);
    })).then(function (logs) {
      var data = {
        app: "scheda-pesistica", version: 1, exportedAt: new Date().toISOString(), maxes: state.maxes,
        programs: programs.map(function (p, i) {
          return { id: p.id, title: p.title, fileName: p.fileName, importedAt: p.importedAt, weeks: p.weeks,
            log: { entries: logs[i].entries || {}, sessions: logs[i].sessions || {} } };
        })
      };
      var name = "Scheda backup " + todayStr() + ".json";
      var blob = new Blob([JSON.stringify(data)], { type: "application/json" });
      setBackupStatus("Backup pronto, conferma il salvataggio…");
      return getDownloads().then(function (dl) {
        if (!dl) { saveBlob(blob, name, setBackupStatus); return; }
        return dl.save({ filename: name, data: blob }).then(function () {
          setBackupStatus("Backup salvato: " + name, "ok");
        }).catch(function (err) {
          var code = err && err.code;
          if (code === "declined") setBackupStatus("Salvataggio annullato.");
          else if (code === "unavailable" || code === "not_granted") saveBlob(blob, name, setBackupStatus);
          else setBackupStatus("Non sono riuscita a salvare il backup" + (err && err.message ? " (" + err.message + ")" : "") + ".", "error");
        });
      });
    }).catch(function () { setBackupStatus("Non sono riuscita a leggere il registro per il backup. Riprova.", "error"); });
  }

  backupInput.addEventListener("change", function () {
    var file = backupInput.files && backupInput.files[0];
    backupInput.value = "";
    if (!file) return;
    file.text().then(function (text) {
      var data = JSON.parse(text);
      if (!data || data.app !== "scheda-pesistica" || !Array.isArray(data.programs)) throw new Error("formato");
      var valid = data.programs.filter(function (p) { return p && typeof p.id === "string" && /^prog-[\w-]+$/.test(p.id) && Array.isArray(p.weeks); });
      if (!valid.length) throw new Error("vuoto");
      var replace = valid.filter(function (p) { return state.programs.some(function (x) { return x.id === p.id; }); }).length;
      state.backupPending = { programs: valid, replace: replace, maxes: data.maxes && typeof data.maxes === "object" ? data.maxes : null, date: data.exportedAt ? new Date(data.exportedAt).toLocaleDateString("it-IT", { day: "numeric", month: "long", year: "numeric" }) : "?" };
      state.backupStatus = null;
      render();
    }).catch(function () {
      setBackupStatus("Questo file non è un backup di Scheda Pesistica.", "error");
      if (!document.getElementById("backup-status")) render();
    });
  });

  function restoreBackup() {
    var bp = state.backupPending; if (!bp) return;
    state.backupPending = null;
    setBackupStatus("Ripristino in corso…");
    var chain = Promise.resolve();
    bp.programs.forEach(function (p) {
      chain = chain.then(function () {
        var program = { id: p.id, title: p.title || "Scheda", fileName: p.fileName || "", importedAt: p.importedAt || new Date().toISOString(), weeks: p.weeks };
        var log = p.log || {};
        return store.save(program).then(function () {
          return store.saveLogs(p.id, log.entries || {}, log.sessions || {});
        }).then(function () {
          state.programs = state.programs.filter(function (x) { return x.id !== p.id; }).concat([program]);
          state.logs[p.id] = log.entries || {};
          state.sessionDates[p.id] = log.sessions || {};
          state.logsLoaded[p.id] = true;
        });
      });
    });
    if (bp.maxes) chain = chain.then(function () {
      state.maxes = Object.assign({ snatch: "", cj: "", bs: "", fs: "", step: 1, map: {} }, bp.maxes);
      return store.saveMaxes(state.maxes);
    });
    chain.then(function () {
      state.backupStatus = { text: (bp.programs.length === 1 ? "Ripristinata 1 scheda." : "Ripristinate " + bp.programs.length + " schede."), kind: "ok" };
      render();
    }).catch(function (err) {
      state.backupStatus = { text: "Ripristino interrotto: " + ((err && err.message) || "errore di salvataggio") + ".", kind: "error" };
      render();
    });
  }

  /* ---------- Export PDF ---------- */
  var downloadsPromise = null;
  function getDownloads() {
    if (!downloadsPromise) {
      var c = window.claude;
      downloadsPromise = c && typeof c.use === "function" ? c.use("downloads").catch(function () { return null; }) : Promise.resolve(null);
    }
    return downloadsPromise;
  }
  function setExportStatus(text, kind) {
    state.exportStatus = text ? { text: text, kind: kind || "" } : null;
    var el = document.getElementById("export-status");
    if (el) { el.textContent = text || ""; el.className = "export-status " + (kind || ""); }
  }
  function safeName(t) { return String(t || "Scheda").replace(/[\\/:*?"<>|]+/g, " ").replace(/\s+/g, " ").trim().slice(0, 120) || "Scheda"; }

  // ExcelJS si carica solo la prima volta che esporti in Excel
  var EXCELJS_URL = "vendor/exceljs.min.js";
  var excelPromise = null;
  function loadExcelJS() {
    if (window.ExcelJS) return Promise.resolve(window.ExcelJS);
    if (!excelPromise) excelPromise = new Promise(function (resolve, reject) {
      var sc = document.createElement("script");
      sc.src = EXCELJS_URL;
      sc.onload = function () { window.ExcelJS ? resolve(window.ExcelJS) : reject(new Error("libreria Excel non valida")); };
      sc.onerror = function () { excelPromise = null; reject(new Error("non riesco a caricare il generatore di Excel, controlla la connessione")); };
      document.head.appendChild(sc);
    });
    return excelPromise;
  }
  function exportOptions(p) {
    var D = datesOf(p.id);
    return {
      program: p, title: p.title,
      subtitle: p.title + " · esportata il " + new Date().toLocaleDateString("it-IT", { day: "numeric", month: "long", year: "numeric" }),
      dateFor: function (wi, si) { var d = D[sessionKey(wi, si)]; return d ? fmtDate(d, true) + (parseDate(d).getFullYear() === new Date().getFullYear() ? " " + parseDate(d).getFullYear() : "") : ""; },
      feedbackFor: function (wi, si, ei, e) { var en = getEntry(p.id, entryKey(wi, si, ei), e, false); return en ? en.feedback : e.feedback; },
      noteFor: function (wi, si, ei, e) { return notesText(e, getEntry(p.id, entryKey(wi, si, ei), e, false)); },
      coachFor: function (wi, si, ei, e) { var en = getEntry(p.id, entryKey(wi, si, ei), e, false); return en ? en.coach || "" : ""; }
    };
  }
  function exportFile(all) { if (state.exportFormat === "xlsx") exportXlsx(all); else exportPdf(all); }
  function exportXlsx(all) {
    var p = currentProgram(); if (!p) return;
    if (!state.logsLoaded[p.id]) { setExportStatus("Sto ancora caricando il tuo registro, riprova tra un attimo.", "error"); return; }
    flushAll();
    var sorted = sortedWeeks(p), weekNo = sorted[state.week].number;
    var weeks = (all ? sorted : [sorted[state.week]]).map(function (w) { return p.weeks.indexOf(w); });
    var name = safeName(p.title) + (all ? "" : " - Settimana " + weekNo) + ".xlsx";
    setExportStatus("Preparo l'Excel…");
    loadExcelJS().then(function (ExcelJS) {
      var o = exportOptions(p); o.weeks = weeks;
      return SchedaXlsx.build(ExcelJS, o).xlsx.writeBuffer();
    }).then(function (buf) {
      var blob = new Blob([buf], { type: XLSX_TYPE });
      deliver(blob, name, "Excel");
    }).catch(function (err) {
      setExportStatus("Non sono riuscita a creare l'Excel: " + ((err && err.message) || "errore sconosciuto") + ".", "error");
    });
  }
  // Salvataggio: dentro Claude con la richiesta di download, fuori con il browser
  function deliver(blob, name, what) {
    setExportStatus(what + " pronto, conferma il salvataggio…");
    getDownloads().then(function (dl) {
      if (!dl) return fallbackDownload(blob, name, what);
      return dl.save({ filename: name, data: blob }).then(function (r) {
        setExportStatus(r && r.status === "delivered" ? what + " inviato." : what + " salvato: " + name, "ok");
      }).catch(function (err) {
        var code = err && err.code;
        if (code === "declined") setExportStatus("Salvataggio annullato.");
        else if (code === "rate_limited") setExportStatus("C'è già una richiesta di salvataggio aperta: completala e riprova.", "error");
        else if (code === "unavailable" || code === "not_granted" || code === "capability_disabled" || code === "capability_removed") fallbackDownload(blob, name, what);
        else setExportStatus("Non sono riuscita a salvare il file" + (err && err.message ? " (" + err.message + ")" : "") + ".", "error");
      });
    });
  }
  var XLSX_TYPE = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";

  function exportPdf(all) {
    var p = currentProgram(); if (!p) return;
    if (!window.jspdf || !window.jspdf.jsPDF) { setExportStatus("Il generatore di PDF non si è caricato. Controlla la connessione e riapri la pagina.", "error"); return; }
    if (!state.logsLoaded[p.id]) { setExportStatus("Sto ancora caricando il tuo registro, riprova tra un attimo.", "error"); return; }
    flushAll();
    var sorted = sortedWeeks(p);
    var o = exportOptions(p), doc;
    o.weeks = (all ? sorted : [sorted[state.week]]).map(function (w) { return p.weeks.indexOf(w); });
    try { doc = SchedaExport.build(window.jspdf.jsPDF, SCHEDA_FONTS, o); }
    catch (err) { setExportStatus("Non sono riuscita a creare il PDF: " + ((err && err.message) || "errore sconosciuto") + ".", "error"); return; }
    deliver(doc.output("blob"), safeName(p.title) + (all ? "" : " - Settimana " + sorted[state.week].number) + ".pdf", "PDF");
  }

  // Fuori da Claude (pagina aperta da sola) uso il download normale del browser.
  function saveBlob(blob, name, report) {
    // Sul telefono apro il menu Condividi (Salva su File, WhatsApp, Mail…): su iPhone è più affidabile del download.
    try {
      var type = /\.pdf$/i.test(name) ? "application/pdf" : /\.xlsx$/i.test(name) ? XLSX_TYPE : "application/json";
      var f = typeof File === "function" ? new File([blob], name, { type: type }) : null;
      var coarse = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
      if (f && coarse && navigator.canShare && navigator.canShare({ files: [f] })) {
        navigator.share({ files: [f], title: name }).then(function () { report("Pronto: " + name, "ok"); })
          .catch(function (err) { if (err && err.name === "AbortError") report("Annullato."); else downloadLink(blob, name, report); });
        return;
      }
    } catch (e) {}
    downloadLink(blob, name, report);
  }
  function downloadLink(blob, name, report) {
    try {
      var url = URL.createObjectURL(blob), a = document.createElement("a");
      a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
      report("Scaricato: " + name, "ok");
    } catch (e) {
      report("Questo browser non permette di scaricare il file da qui.", "error");
    }
  }
  function fallbackDownload(blob, name, what) {
    saveBlob(blob, name, function (text, kind) { setExportStatus(text.indexOf("Scaricato") === 0 ? (what || "File") + " scaricato: " + name : text, kind); });
  }


  /* ---------- Calendario ---------- */
  function calendarEvents() {
    var out = [];
    state.programs.forEach(function (p) {
      var D = state.sessionDates[p.id] || {};
      Object.keys(D).forEach(function (k) {
        var d = D[k], parts = k.split("-").map(Number);
        var w = p.weeks[parts[0]], s = w && w.sessions[parts[1]];
        if (!d || !s) return;
        var completed = 0;
        s.exercises.forEach(function (e, ei) { if (isComplete(e, getEntry(p.id, entryKey(parts[0], parts[1], ei), e, false))) completed++; });
        out.push({ date: d, p: p, wi: parts[0], si: parts[1], week: w, session: s, completed: completed });
      });
    });
    return out.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : a.week.number - b.week.number || a.session.number - b.session.number; });
  }

  function calendarRow(ev) {
    var d = parseDate(ev.date);
    var total = ev.session.exercises.length;
    return '<button class="row" data-action="open-cal-session" data-pid="' + esc(ev.p.id) + '" data-w="' + ev.wi + '" data-s="' + ev.si + '">' +
      '<div class="date-badge"><b>' + d.getDate() + '</b><span>' + esc(d.toLocaleDateString("it-IT", { weekday: "short" })) + '</span></div>' +
      '<div class="row-main"><div class="row-title">Sessione ' + ev.session.number + ' · Settimana ' + ev.week.number + '</div>' +
      '<div class="row-sub">' + esc(ev.p.title) + ' · ' + (ev.completed === total ? "completata" : ev.completed + " di " + total + " esercizi completati") + '</div></div>' +
      (ev.completed === total ? ICON.checkCircle : ICON.chev) + '</button>';
  }

  function viewCalendar() {
    var waiting = state.programs.some(function (p) { return !state.logsLoaded[p.id]; });
    var events = calendarEvents();
    if (!state.calMonth) {
      var latest = events.length ? events[events.length - 1].date : todayStr();
      state.calMonth = latest.slice(0, 7);
      if (!state.calDay) state.calDay = latest;
    }
    var y = +state.calMonth.slice(0, 4), m = +state.calMonth.slice(5, 7);
